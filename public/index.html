<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairwise</title>
<meta name="theme-color" content="#E8590C">
<script>
/* Apply the signed-in person's saved theme before first paint, so the startup loader matches it (same storage as app.js loadState). */
try{
  var e=((JSON.parse(localStorage.getItem('pairwise-session')||'null')||{}).email||'').toLowerCase();
  var t=e&&(JSON.parse(localStorage.getItem('pairwise-budget-v2:'+e)||'null')||{}).theme;
  if(!t)t=localStorage.getItem('pairwise-theme'); /* signed out or no saved choice: last theme picked on this device */
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
}catch(_){}
</script>
<link rel="icon" type="image/svg+xml" href="icon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="icon-dark.svg" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="boot run" id="boot" role="status" aria-live="polite">
  <div class="boot-lockup">
    <svg class="boot-mark" viewBox="0 0 120 120" aria-hidden="true">
      <g class="boot-sway sway-a"><rect class="boot-bar bar-a" x="22" y="36" width="64" height="22" rx="11"/></g>
      <g class="boot-sway sway-b"><rect class="boot-bar bar-b" x="34" y="62" width="64" height="22" rx="11"/></g>
    </svg>
    <span class="boot-word" aria-hidden="true"><span class="clip"><span class="rise r1">Pair</span></span><span class="clip"><span class="rise r2">wise</span></span></span>
  </div>
  <span class="boot-sr">Loading Pairwise</span>
</div>
<noscript><style>.boot{display:none}</style></noscript>
<script>
(function(){
  /* the logo intro finishes at 1.3s; reloads later in the same session skip it */
  var seen=false;try{seen=!!sessionStorage.getItem('pairwise-booted');sessionStorage.setItem('pairwise-booted','1')}catch(_){}
  var MIN_MS=seen?0:1300,boot=document.getElementById('boot');
  if(seen){boot.remove();return}
  var ready=document.readyState==='complete'?Promise.resolve():new Promise(function(r){window.addEventListener('load',r,{once:true})});
  var minimum=new Promise(function(r){setTimeout(r,MIN_MS)});
  Promise.all([ready,minimum]).then(function(){
    boot.classList.add('done');
    setTimeout(function(){boot.remove()},700);
  });
})();
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="mg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d8cdb4"/></radialGradient>
    <linearGradient id="spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8622a" stop-opacity=".22"/><stop offset="1" stop-color="#e8622a" stop-opacity="0"/></linearGradient>
  </defs>
  <symbol id="mascot-art" viewBox="0 0 100 110">
    <ellipse cx="21" cy="52" rx="8" ry="19" transform="rotate(-16 21 52)" fill="url(#mg)"/>
    <ellipse cx="79" cy="52" rx="8" ry="19" transform="rotate(16 79 52)" fill="url(#mg)"/>
    <ellipse cx="50" cy="70" rx="30" ry="33" fill="url(#mg)"/>
    <ellipse cx="50" cy="42" rx="28" ry="25" fill="url(#mg)"/>
    <ellipse cx="38" cy="102" rx="9" ry="5" fill="#cbbf9f"/><ellipse cx="62" cy="102" rx="9" ry="5" fill="#cbbf9f"/>
    <circle cx="40" cy="42" r="3.2" fill="#3a2f27"/><circle cx="60" cy="42" r="3.2" fill="#3a2f27"/>
    <ellipse cx="50" cy="49" rx="3.4" ry="2.4" fill="#b8674a"/>
    <ellipse cx="33" cy="50" rx="4" ry="2.5" fill="#f0b9a0" opacity=".6"/><ellipse cx="67" cy="50" rx="4" ry="2.5" fill="#f0b9a0" opacity=".6"/>
  </symbol>
</svg>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand"><svg class="mark" viewBox="0 0 158 99" aria-hidden="true"><rect class="mk-a" width="133" height="45" rx="22.5"/><rect class="mk-b" x="25" y="54" width="133" height="45" rx="22.5"/></svg><span class="wm">Pair<b>wise</b></span></div>
    <nav class="pills" id="nav" aria-label="Main"></nav>
    <div class="tools">
      <button class="round" data-act="bell" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
      <button class="round" data-act="theme" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="lang" data-act="lang" aria-label="Language">EN</button>
      <button class="avatar" data-act="avatar" aria-label="Account menu"></button>
      <div class="pop" id="bellpop" hidden></div><div class="pop" id="userpop" hidden></div>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

<div class="mascot" id="mascot" role="button" tabindex="0" aria-label="Open assistant">
  <div class="bubble" id="bubble">Need a hand? Ask me</div>
  <svg viewBox="0 0 100 110"><use href="#mascot-art"/></svg>
</div>

<aside class="chat" id="chat" aria-label="Assistant" aria-hidden="true">
  <header>
    <div class="av"><svg viewBox="0 0 100 110"><use href="#mascot-art"/></svg></div>
    <div><b>Cleo</b><span>Your money assistant</span></div>
    <button data-act="chat-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="msgs" id="msgs"></div>
  <div class="quick" id="quick"></div>
  <form id="chatform"><input id="chatin" placeholder="Ask me anything…" autocomplete="off" aria-label="Message"><button aria-label="Send"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
  <div class="aihint" id="aihint" hidden>Cleo uses AI with the numbers in this app. She can make mistakes, so double-check big decisions.</div>
</aside>
<div class="toast" id="toast" role="status"></div>
<button class="qafab" id="qafab" data-act="qa" hidden aria-label="Add expense, income or update a balance">+ Add</button>
<div id="modalroot"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
